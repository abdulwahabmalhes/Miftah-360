name: miftah_mobile
description: "Miftah 360 Car Owner Mobile Application - Wave 2 Official Flutter Client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking & HTTP
  dio: ^5.4.0

  # State Management & DI
  provider: ^6.1.1

  # Local Storage
  shared_preferences: ^2.2.2

  # Formatting & Localization
  intl: ^0.19.0

  # UI & Styling
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

